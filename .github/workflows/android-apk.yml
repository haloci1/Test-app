name: Ndërto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Hap zip-in e projektit
        run: |
          unzip -q numina-android.zip -d build
          ls build/numina-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalo paketat dhe kopjo app-in te Android
        working-directory: build/numina-android
        run: |
          npm ci
          npx cap sync android

      - name: Ndërto APK (provë, me reklama provë)
        working-directory: build/numina-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: numina-apk
          path: build/numina-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Versioni për Google Play: i nënshkruar, me reklama reale. Ndërtohet vetëm kur ke vendosur çelësin te Secrets.
      - name: Ndërto AAB për Play Store
        if: env.HAS_KEY == 'true'
        working-directory: build/numina-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sed -i "s/ADS_TEST: true/ADS_TEST: false/" www/config.js
          npx cap sync android
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/numina-upload.jks
          export KEYSTORE_FILE=numina-upload.jks
          cd android && ./gradlew bundleRelease --no-daemon
          rm -f app/numina-upload.jks

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: numina-aab-playstore
          path: build/numina-android/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Faqet web: reader.html, admin.html, reset.html, faqet ligjore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/numina-android/www

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
