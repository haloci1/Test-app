name: Ndërto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hap zip-in e projektit
        run: |
          unzip -q numina-android.zip -d build
          ls build/numina-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalo paketat dhe kopjo app-in te Android
        working-directory: build/numina-android
        run: |
          npm ci
          npx cap sync android

      - name: Ndërto APK
        working-directory: build/numina-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: numina-apk
          path: build/numina-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Faqja web: reader.html (për lexueset) + faqet ligjore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/numina-android/www

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
